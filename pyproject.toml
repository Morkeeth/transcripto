[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transcripto"
version = "0.2.0"
description = "Instant replay for coding agents. Inspect requests, tool calls, and recorded results across Claude Code, Codex, and Cursor. Local, stdlib-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Oscar Morke" }]
keywords = ["claude-code", "coding-agents", "transcripts", "local-first", "analytics"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]
# No runtime dependencies. Standard library only — that is the whole pitch.
dependencies = []

[project.urls]
Homepage = "https://github.com/Morkeeth/transcripto"
Source = "https://github.com/Morkeeth/transcripto"

[project.scripts]
transcripto = "transcripto:main"

[tool.setuptools]
py-modules = ["transcripto", "transcripto_core", "transcripto_replay", "transcripto_sources"]
