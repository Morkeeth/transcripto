name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install distribution test tooling
        run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - name: Stage 0 theme-replay experiment
        working-directory: experiments/theme-replay
        run: PYTHONPATH=. python -m unittest tests.test_theme_replay -v
      - name: Stage 0 live-path tests (mocked transport, no network)
        working-directory: experiments/theme-replay
        run: PYTHONPATH=.:tests python -m unittest tests.test_stage0_live -v
      - name: Stage 0 committed verdict reproduces offline
        working-directory: experiments/theme-replay
        run: ./run_stage0.sh --rescore
      - run: for test in test_*.sh; do bash "$test" || exit 1; done
      - run: python -m pip wheel --no-deps . --wheel-dir /tmp/wheels
      - run: python -m pip install --no-deps /tmp/wheels/transcripto-*.whl
      - working-directory: /tmp
        run: |
          transcripto --version
          transcripto replay --demo --json | python -c 'import json,sys; r=json.load(sys.stdin); assert r["synthetic"] and r["episodes"][0]["events"][0]["status"] == "failed"'
